<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awards - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: rgba(255,255,255,0.03);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 24px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .sidebar-logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 32px;
        }
        .nav-link {
            display: block;
            padding: 12px 16px;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(99, 102, 241, 0.1);
            color: #6366f1;
        }
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 32px;
            max-width: calc(100% - 260px);
        }
        .page-title { font-size: 28px; font-weight: 700; margin-bottom: 24px; }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h3 { margin-bottom: 20px; font-size: 18px; color: #e0e0e0; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        th { color: #9ca3af; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .hidden { display: none !important; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; height: auto; }
            .main-content { margin-left: 0; max-width: 100%; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">Chirag Admin</div>
        <a href="/admin" class="nav-link {{ 'active' if active_page == 'dashboard' }}">Dashboard</a>
        <a href="/admin/projects" class="nav-link {{ 'active' if active_page == 'projects' }}">Projects</a>
        <a href="/admin/categories" class="nav-link {{ 'active' if active_page == 'categories' }}">Categories</a>
        <a href="/admin/settings" class="nav-link {{ 'active' if active_page == 'settings' }}">Settings</a>
        <a href="/admin/media" class="nav-link {{ 'active' if active_page == 'media' }}">Media</a>
        <a href="/admin/seo" class="nav-link {{ 'active' if active_page == 'seo' }}">SEO</a>
        <a href="/admin/skills" class="nav-link {{ 'active' if active_page == 'skills' }}">Skills</a>
        <a href="/admin/experience" class="nav-link {{ 'active' if active_page == 'experience' }}">Experience</a>
        <a href="/admin/awards" class="nav-link {{ 'active' if active_page == 'awards' }}">Awards</a>
        <a href="/admin/software" class="nav-link {{ 'active' if active_page == 'software' }}">Software</a>
        <a href="/admin/logout" class="nav-link" style="color: #ef4444;">Logout</a>
    </aside>
    <main class="main-content">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h1 class="page-title">Awards</h1>
        <div id="award-form" class="card">
            <h3 style="margin-bottom: 20px;" id="award-form-title">Add Award</h3>
            <form id="award-form-el" onsubmit="saveAward(event)">
                <input type="hidden" name="edit_index" id="award-edit-index" value="">
                <div class="form-row">
                    <div class="form-group">
                        <label>Event</label>
                        <input type="text" name="event" id="award-event" required>
                    </div>
                    <div class="form-group">
                        <label>Achievement</label>
                        <input type="text" name="achievement" id="award-achievement" required>
                    </div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="hideAwardForm()">Cancel</button>
                </div>
            </form>
        </div>
        <div class="card">
            <div id="award-message" class="message"></div>
            <table>
                <thead>
                    <tr><th>Event</th><th>Achievement</th><th>Actions</th></tr>
                </thead>
                <tbody id="awards-list">
                    <tr><td colspan="3" style="color:#6b7280;text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        function hideAwardForm() {
            document.getElementById('award-form').classList.add('hidden');
            resetAwardForm();
        }
        function resetAwardForm() {
            document.getElementById('award-form-el').reset();
            document.getElementById('award-edit-index').value = '';
            document.getElementById('award-form-title').textContent = 'Add Award';
        }
        function showMessage(text, type) {
            const el = document.getElementById('award-message');
            el.textContent = text;
            el.className = 'message ' + type;
        }
        async function loadAwards() {
            const csrf = document.querySelector('input[name=csrf_token]').value;
            const res = await fetch('/api/admin/settings/awards', {
                headers: {'X-CSRFToken': csrf}
            });
            if (!res.ok) {
                showMessage('Error loading awards', 'error');
                return;
            }
            const awards = await res.json();
            const tbody = document.getElementById('awards-list');
            tbody.innerHTML = '';
            if (awards.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:#6b7280;text-align:center;">No awards yet</td></tr>';
                return;
            }
            awards.forEach((award, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = '<td>' + escapeHtml(award.event || '') + '</td><td>' + escapeHtml(award.achievement || '') + '</td><td><div style="display:flex;gap:8px;"><button class="btn btn-secondary" onclick="editAward(' + idx + ')">Edit</button><button class="btn btn-danger" onclick="deleteAward(' + idx + ')">Delete</button></div></td>';
                tbody.appendChild(tr);
            });
        }
        async function saveAward(e) {
            e.preventDefault();
            const editIndex = document.getElementById('award-edit-index').value;
            const data = {
                event: document.getElementById('award-event').value,
                achievement: document.getElementById('award-achievement').value
            };
            const csrf = document.querySelector('input[name=csrf_token]').value;
            const url = editIndex !== '' ? '/api/admin/settings/awards/' + editIndex : '/api/admin/settings/awards';
            const method = editIndex !== '' ? 'PUT' : 'POST';
            const res = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
                body: JSON.stringify(data)
            });
            if (res.ok) {
                showMessage(editIndex !== '' ? 'Award updated' : 'Award added', 'success');
                resetAwardForm();
                document.getElementById('award-form').classList.add('hidden');
                loadAwards();
            } else {
                const err = await res.json().catch(() => ({}));
                showMessage('Error saving award: ' + (err.error || 'Unknown'), 'error');
            }
        }
        async function editAward(idx) {
            const csrf = document.querySelector('input[name=csrf_token]').value;
            const res = await fetch('/api/admin/settings/awards', {
                headers: {'X-CSRFToken': csrf}
            });
            const awards = await res.json();
            const award = awards[idx];
            if (!award) return;
            document.getElementById('award-edit-index').value = idx;
            document.getElementById('award-event').value = award.event || '';
            document.getElementById('award-achievement').value = award.achievement || '';
            document.getElementById('award-form-title').textContent = 'Edit Award';
            document.getElementById('award-form').classList.remove('hidden');
        }
        async function deleteAward(idx) {
            if (!confirm('Are you sure?')) return;
            const csrf = document.querySelector('input[name=csrf_token]').value;
            const res = await fetch('/api/admin/settings/awards/' + idx, {
                method: 'DELETE',
                headers: {'X-CSRFToken': csrf}
            });
            if (res.ok) {
                showMessage('Award deleted', 'success');
                loadAwards();
            } else {
                showMessage('Error deleting award', 'error');
            }
        }
        loadAwards();
    </script>
</body>
</html>
