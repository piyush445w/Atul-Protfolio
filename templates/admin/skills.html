{% extends "admin/base.html" %}
{% block content %}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<h1 class="page-title">Skills</h1>
<div class="card">
    <div class="skill-list" id="skills-list">
        {% for skill in skills %}
        <div class="skill-tag">
            {{ skill }}
            <button onclick='removeSkill(this)'>&times;</button>
        </div>
        {% endfor %}
    </div>
    <div style="display: flex; gap: 12px;">
        <input type="text" id="new-skill" placeholder="Add a new skill..." style="flex: 1;">
        <button type="button" class="btn btn-primary" onclick="addSkill()">Add</button>
    </div>
</div>
<script>
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    function addSkill() {
        const input = document.getElementById('new-skill');
        const val = input.value.trim();
        if (!val) return;
        const div = document.createElement('div');
        div.className = 'skill-tag';
        div.innerHTML = val + ' <button onclick="removeSkill(this)">&times;</button>';
        document.getElementById('skills-list').appendChild(div);
        input.value = '';
        saveSkills();
    }
    function removeSkill(btn) {
        btn.parentElement.remove();
        saveSkills();
    }
    async function saveSkills() {
        const skills = [];
        document.querySelectorAll('#skills-list .skill-tag').forEach(el => {
            const textNode = Array.from(el.childNodes).find(n => n.nodeType === Node.TEXT_NODE);
            skills.push(textNode ? textNode.textContent.trim() : '');
        });
        const csrf = document.querySelector('input[name=csrf_token]').value;
        try {
            const res = await fetch('/api/admin/settings/skills', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
                body: JSON.stringify(skills)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                alert('Error saving skills: ' + (err.error || 'Unknown error'));
            }
        } catch (e) {
            alert('Error saving skills: ' + e.message);
        }
    }
</script>
{% endblock %}
