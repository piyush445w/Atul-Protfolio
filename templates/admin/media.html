{% extends "admin/base.html" %}
{% block content %}
<h1 class="page-title">Media Library</h1>
<div class="card">
    <h3 style="margin-bottom: 16px;">Upload Media</h3>
    <form id="upload-form" onsubmit="uploadMedia(event)" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>File</label>
            <input type="file" name="file" required>
        </div>
        <div class="form-group">
            <label>Folder</label>
            <select name="folder">
                <option value="hero">Hero</option>
                <option value="projects">Projects</option>
                <option value="general">General</option>
            </select>
        </div>
        <div class="upload-progress" id="media-upload-progress">
            <div class="upload-progress-bar" id="media-upload-progress-bar"></div>
            <span class="upload-progress-text" id="media-upload-progress-text">0%</span>
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
    </form>
</div>
<div class="media-grid">
    {% for m in media %}
    <div class="media-item">
        {% if m.type in ['jpg', 'jpeg', 'png', 'gif', 'webp'] %}
        <img src="{{ m.url }}" alt="{{ m.filename }}">
        {% else %}
        <div style="height: 150px; display: flex; align-items: center; justify-content: center; color: #6b7280;">{{ m.type.upper() }}</div>
        {% endif %}
        <div class="media-item-info">
            <div style="font-weight: 600; color: #e0e0e0;">{{ m.filename }}</div>
            <div>{{ formatSize(m.size) }} | {{ m.type }}</div>
        </div>
        <div class="media-item-actions">
            <button class="btn btn-primary" onclick="copyMediaUrl('{{ m.url }}')">Copy URL</button>
            <button class="btn btn-danger" onclick="deleteMedia('{{ m.id }}')">Delete</button>
        </div>
    </div>
    {% endfor %}
</div>
<script>
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    function copyMediaUrl(url) {
        navigator.clipboard.writeText(window.location.origin + url).then(() => { alert('URL copied: ' + url); });
    }
    function uploadMedia(e) {
        e.preventDefault();
        const form = e.target;
        const fd = new FormData(form);
        const csrf = form.querySelector('input[name=csrf_token]').value;
        const progressContainer = document.getElementById('media-upload-progress');
        const progressBar = document.getElementById('media-upload-progress-bar');
        const progressText = document.getElementById('media-upload-progress-text');
        const btn = form.querySelector('button[type="submit"]');
        const originalText = btn.textContent;
        
        btn.disabled = true;
        btn.textContent = 'Uploading...';
        progressContainer.classList.add('active');
        progressBar.style.width = '0%';
        progressText.textContent = '0%';
        
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/admin/upload', true);
        xhr.setRequestHeader('X-CSRFToken', csrf);
        
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percent + '%';
                progressText.textContent = percent + '%';
            }
        };
        
        xhr.onload = function() {
            btn.disabled = false;
            btn.textContent = originalText;
            if (xhr.status >= 200 && xhr.status < 300) {
                if (window.BroadcastChannel) {
                    const bc = new BroadcastChannel('portfolio-updates');
                    bc.postMessage({ type: 'media-uploaded', timestamp: Date.now() });
                    bc.close();
                }
                location.reload();
            } else {
                progressContainer.classList.remove('active');
                alert('Upload failed');
            }
        };
        
        xhr.onerror = function() {
            btn.disabled = false;
            btn.textContent = originalText;
            progressContainer.classList.remove('active');
            alert('Upload error');
        };
        
        xhr.send(fd);
    }
    async function deleteMedia(id) {
        if (!confirm('Delete this file?')) return;
        const csrf = document.querySelector('input[name=csrf_token]').value;
        const res = await fetch('/api/admin/media/' + encodeURIComponent(id), { method: 'DELETE', headers: {'X-CSRFToken': csrf} });
        if (res.ok) { location.reload(); } else { alert('Error deleting media'); }
    }
</script>
<style>
.upload-progress {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.05);
    border-radius: 4px;
    margin-top: 12px;
    overflow: hidden;
    display: none;
}
.upload-progress.active {
    display: block;
}
.upload-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    border-radius: 4px;
    transition: width 0.2s ease;
    width: 0%;
}
.upload-progress-text {
    display: block;
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    margin-top: 6px;
}
</style>
{% endblock %}
